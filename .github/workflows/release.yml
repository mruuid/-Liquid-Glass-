name: Publish Liquid Glass Release

on:
  workflow_run:
    workflows:
      - Build Liquid Glass
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  publish:
    name: Publish v0.3.0
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message == 'Finalize Liquid Glass 26 v0.3.0'
    runs-on: ubuntu-latest

    steps:
      - name: Download the successful rootless build
        uses: actions/download-artifact@v4
        with:
          name: liquid-glass-deb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist

      - name: Verify Debian package
        run: |
          set -e
          shopt -s nullglob
          packages=(dist/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --field "${packages[0]}" Package | grep -Fx 'com.mruuid.liquidglass26'
          dpkg-deb --field "${packages[0]}" Version | grep -Fx '0.3.0'
          dpkg-deb --field "${packages[0]}" Architecture | grep -Fx 'iphoneos-arm64'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Liquid Glass 26 v0.3.0
          body: |
            ## Liquid Glass 26 — v0.3.0

            Rootless update for Dopamine on iOS 18.

            **Target:** iPhone XR (A12) · iOS 18.7.1
            **Package:** Debian .deb for Sileo / Zebra
            **Architectures:** arm64, arm64e

            ### What's new
            - Live preference refresh: visible interfaces are marked for layout again after settings change, so most tweaks apply without relaunching apps or respringing.
            - Improved volume/ringer HUD discovery: scans nested HUD views and recognizes both horizontal and vertical capsule-shaped surfaces.
            - More complete visual profile invalidation for glass intensity, Reduce Transparency, material refinements, and Performance Mode.
            - Existing Lock Screen clock, Dock/folder, notification, Control Center, system-bar and accessibility options retained.

            This is a development build. CI validates compilation and Debian packaging; it does not replace testing on a physical device. Private SpringBoard class names and layouts can vary between iOS builds.
          files: dist/*.deb
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Rebuild APT repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run repository.yml --repo "$GITHUB_REPOSITORY"
