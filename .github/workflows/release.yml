name: Publish Liquid Glass Release

on:
  workflow_run:
    workflows:
      - Build Liquid Glass
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  publish:
    name: Publish Liquid Glass package
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Finalize Liquid Glass 26 v')
    runs-on: ubuntu-latest

    steps:
      - name: Download the successful rootless build
        uses: actions/download-artifact@v4
        with:
          name: liquid-glass-deb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist

      - name: Verify Debian package and extract version
        id: package
        env:
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.deb)
          test "${#packages[@]}" -eq 1

          package="${packages[0]}"
          package_name="$(dpkg-deb --field "$package" Package)"
          package_version="$(dpkg-deb --field "$package" Version)"
          package_arch="$(dpkg-deb --field "$package" Architecture)"

          test "$package_name" = "com.mruuid.liquidglass26"
          test "$package_arch" = "iphoneos-arm64"
          test "$COMMIT_MESSAGE" = "Finalize Liquid Glass 26 v$package_version"

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          dpkg-deb --info "$package"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Liquid Glass 26 v${{ steps.package.outputs.version }}
          body: |
            ## Liquid Glass 26 — v${{ steps.package.outputs.version }}

            Rootless package for Dopamine on iOS 18.

            **Target:** iPhone XR (A12) · iOS 18.7.1
            **Package:** Debian .deb for Sileo / Zebra
            **Architectures:** arm64, arm64e

            This is a development build. CI validates compilation and Debian packaging; it does not replace testing on a physical device. Private SpringBoard class names and layouts can vary between iOS builds.
          files: dist/*.deb
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Rebuild APT repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run repository.yml --repo "$GITHUB_REPOSITORY"
