name: Publish Liquid Glass Release

on:
  workflow_run:
    workflows:
      - Build Liquid Glass
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish v0.2.0
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message == 'Finalize Liquid Glass 26 v0.2.0'
    runs-on: ubuntu-latest

    steps:
      - name: Download the successful rootless build
        uses: actions/download-artifact@v4
        with:
          name: liquid-glass-deb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Liquid Glass 26 v0.2.0
          body: |
            ## Liquid Glass 26 — v0.2.0

            Expanded rootless release for Dopamine on iOS 18.

            **Target:** iPhone XR (A12) · iOS 18.7.1
            **Package:** Debian .deb for Sileo / Zebra
            **Architectures:** arm64, arm64e

            ### New in v0.2.0
            - Glass treatment for the Lock Screen clock container.
            - Glass material for supported volume and ringer HUD surfaces.
            - iOS 27-inspired material refinements: clearer highlights, stronger edge contrast, and adjustable glass intensity.
            - Spring-based glass entrance transitions.
            - Settings pane for effect toggles, intensity, and performance mode.
            - Reduce Motion, Reduce Transparency, and Low Power Mode adaptations.
            - Cached visual-effect views and idempotent layout hooks.

            This is a development build. CI confirms compilation and Debian packaging, but the package has not yet been tested on a physical iPhone XR. Private SpringBoard classes can vary between iOS builds.
          files: dist/*.deb
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
